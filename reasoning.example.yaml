# Example configuration for the reasoning evaluation pipeline
# (src/weedvlm/scripts/score-reasoning.py). Pass it with --config:
#
#   uv run src/weedvlm/scripts/score-reasoning.py --config reasoning.example.yaml
#
# A judge VLM reads each stored response's reasoning alongside the
# question, its image and the ground truth, and grades it. The judge is
# never told which model wrote the response.
#
# The API key comes from OPENROUTER_API_KEY, in the environment or in a
# .env file at the repo root.

# Where the generated questions are (the out_dir of
# generate-all-questions.py).
questions_dir: questions/

# The config those questions were generated with. Default:
# generation-config.yaml inside questions_dir.
# generation_config: questions/generation-config.yaml

# The responses to judge are read from the benchmark database, so this
# must be sqlite, which is also the default (docs/DATABASE.md).
storage:
  format: sqlite
  # database: questions/benchmark.db   # default: benchmark.db in questions_dir

# Evaluation runs (runs.name in the database) whose responses get
# judged. Only responses with status 'ok' carry reasoning to judge.
responses_to_evaluate:
  - claude-haiku-full-run
  - deepseek-4-1-flash-full-run
  - gemma4-31b-full-run
  - gpt-6-1-sol-partial-run
  - gpt-6-luna-full-run

# Progress and logs go to <output_dir>/<run_name>/. Re-running with the
# same run_name resumes it, skipping responses that are already judged.
output_dir: reasoning-results/
run_name: reasoning-run

# Which tasks' responses to judge.
tasks:
  species_id: true
  fine_grained: true
  density: true
  grounded_vqa: true
  localisation: true

# The judge: a bare OpenRouter model id uses the defaults below; a
# mapping overrides them. extra_body is merged into the request as-is
# (OpenRouter's `reasoning`, `provider` routing, etc.). Use a model that
# isn't one of those being judged, so it never grades its own reasoning.
evaluation_model:
  id: google/gemini-3.8-flash
  # temperature: 0.0
  # max_tokens: 4096          # reasoning models spend this on thinking
  # extra_body:
  #   reasoning: {effort: low}

# Judge only an evenly sampled share of the selected responses: a number
# (0.1) or a fraction ("1/10"). 1 judges all of them.
reasoning_fraction: 0.2

# Incorrect responses are sampled by count, not fraction: exactly this many
# per task (species ID split into multiple choice and open-ended) per model,
# so every model gets the same number. reasoning_fraction applies to the
# correct responses only. A model with fewer incorrect responses than this
# in any task stops the run. Either one number for every task, or a number
# for each of the five tasks (grounded VQA has few incorrect responses):
wrong_per_task: 50
# wrong_per_task:
#   species_id_multiple_choice: 30
#   species_id_open_ended: 50
#   fine_grained: 50
#   grounded_vqa: 5
#   density: 50

# Requests in flight at once (1-32). Each request carries a base64 image.
concurrency: 16

defaults:
  temperature: 0.0
  # A judge reply cut off by this limit is recorded as a failure. Raise it
  # for reasoning models, which spend much of it on hidden thinking.
  max_tokens: 1024
  timeout_seconds: 120

retry:
  max_retries: 5             # transient errors: 429, 5xx, timeouts, dropped connections
  max_parse_retries: 2       # replies that arrive but hold no usable JSON verdict
  backoff_base_seconds: 2    # doubles each retry, with jitter, honouring Retry-After
  backoff_max_seconds: 60
  # Stop the run after this many failed judgements in a row (typo'd
  # model id, no image support, provider down). 0 disables.
  model_failure_threshold: 25
