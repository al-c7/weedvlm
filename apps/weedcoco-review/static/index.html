<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WeedCOCO Review</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>WeedCOCO Review</h1>
      <div id="dataset-summary" class="muted"></div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <section>
          <h2>1. Select species</h2>
          <div class="row">
            <button id="select-all">All</button>
            <button id="select-none">None</button>
          </div>
          <ul id="category-list" class="category-list"></ul>
        </section>

        <section>
          <h2>2. Sample size</h2>
          <label class="row">
          Images per species (N)
          <input id="sample-n" type="number" min="1" value="20" />
        </label>
          <label class="row">
          <input id="unreviewed-only" type="checkbox" />
          Only sample unreviewed images
        </label>
          <button id="build-queue" class="primary">Build review queue</button>
        </section>

        <section>
          <h2>Progress</h2>
          <div id="progress" class="muted">No queue yet</div>
          <div class="progress-bar">
            <div id="progress-fill"></div>
          </div>
          <a id="download-review" href="/api/review" download="review.json">Download review.json</a>
        </section>
      </aside>

      <main class="viewer" id="viewer">
        <p class="empty-state">Select species and build a review queue to start.</p>
      </main>
    </div>

    <template id="viewer-template">
      <div class="viewer-header">
        <span id="viewer-position"></span>
        <span id="viewer-filename" class="muted"></span>
        <span id="save-status" class="muted"></span>
      </div>
      <div class="image-stage">
        <img id="viewer-image" alt="current review image" />
        <canvas id="viewer-canvas"></canvas>
      </div>
      <ul id="annotation-list" class="annotation-list"></ul>
      <div class="decision-bar">
        <button id="btn-prev">&larr; Prev (←)</button>
        <button id="btn-reject" class="reject">Reject image (B)</button>
        <button id="btn-accept" class="accept">Accept image (G)</button>
        <button id="btn-next">Next (→) &rarr;</button>
      </div>
      <p class="hint muted">
      Shortcuts: G accept &middot; B reject &middot; ←/→ navigate &middot; number keys toggle an
      annotation's good/bad flag
    </p>
    </template>

    <script type="module" src="/app.js"></script>
  </body>
</html>
