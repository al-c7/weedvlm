<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>weedvlm rationale labeller</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 0; color: #222; }
      header { display: flex; gap: 1rem; align-items: center; padding: .6rem 1rem; border-bottom: 1px solid #ddd; }
      header h1 { font-size: 1rem; margin: 0; }
      .muted { color: #777; }
      #bar { flex: 1; height: 6px; background: #eee; border-radius: 3px; }
      #fill { height: 100%; background: #3b8; border-radius: 3px; }
      main { display: grid; grid-template-columns: minmax(0, 1fr) 24rem; gap: 1rem; padding: 1rem; }
      pre { white-space: pre-wrap; background: #f7f7f5; padding: .8rem; border-radius: 6px; margin: 0 0 1rem; }
      img { max-width: 100%; border-radius: 6px; }
      .field { margin-bottom: 1rem; }
      .field b { display: block; margin-bottom: .25rem; text-transform: capitalize; }
      .scale { display: flex; gap: 2px; }
      .scale button { flex: 1; padding: .35rem 0; border: 1px solid #ccc; background: #fff; cursor: pointer; }
      .scale button.on { background: #258; color: #fff; border-color: #258; }
      textarea { width: 100%; height: 4rem; box-sizing: border-box; }
      .row { display: flex; gap: .5rem; margin-top: .5rem; }
      .row button { padding: .45rem .8rem; }
      .primary { background: #258; color: #fff; border: 0; border-radius: 4px; }
      .judge { background: #fff8e6; border: 1px solid #eadca8; border-radius: 6px; padding: .6rem; margin-top: 1rem; }
      table { border-collapse: collapse; margin-top: .5rem; }
      td, th { padding: .15rem .6rem; text-align: right; border-bottom: 1px solid #eee; }
      #agreement { padding: 0 1rem 2rem; }
    </style>
  </head>
  <body>
    <header>
      <h1>weedvlm rationale labeller</h1>
      <div id="bar"><div id="fill"></div></div>
      <span id="progress" class="muted"></span>
    </header>
    <main>
      <section id="item"></section>
      <aside id="form"></aside>
    </main>
    <section id="agreement"></section>
    <script type="module" src="/app.js"></script>
  </body>
</html>
